<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharva</title>
<style>
:root{--or:#FF7A00;--bk:#111;--bg:#fff7ef;--sf:#fff;--tx:#161616;--mu:#6b6258;--ln:#f0dcc8;--them:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--sf:#1a1a1a;--tx:#f5efe8;--mu:#a89c8e;--ln:#2c2620;--them:#1f1c19}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.auth{justify-content:center;padding:24px;overflow:auto}
.logo{display:block;margin:0 auto 8px}
h1{font-size:34px;margin:0;text-align:center}
.sub{text-align:center;color:var(--mu);margin:4px 0 20px}
.tabs{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:10px;border-radius:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--bk);color:var(--or);font-weight:700}
input[type=text],input[type=password],input[type=email],input[type=tel]{width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;color:var(--mu);margin:2px 0 14px;font-size:14px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--or);color:var(--bk);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--or);font:inherit;cursor:pointer;margin-top:12px;width:100%}
.err{color:#d93025;font-size:14px;min-height:20px;margin:0 0 8px}
.foot{text-align:center;color:var(--mu);font-size:13px;padding:10px}
.foot b{color:var(--or)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bk);color:#fff}
.bar .t{flex:1;font-weight:700}
.bar button{background:none;border:0;color:var(--or);font:inherit;cursor:pointer;padding:6px}
.av{width:42px;height:42px;border-radius:50%;background:var(--bk);color:var(--or);display:grid;place-items:center;font-weight:700;border:2px solid var(--or);flex:none}
.list{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);cursor:pointer;width:100%;background:none;color:inherit;font:inherit;text-align:left}
.row small{color:var(--mu);display:block}
.empty{color:var(--mu);text-align:center;padding:30px 20px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 12px;border-radius:16px;background:var(--them);border:1px solid var(--ln);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:var(--or);color:var(--bk);border-color:var(--or)}
.m img,.m video{max-width:100%;border-radius:10px;display:block}
.m audio{max-width:100%}
.m time{display:block;font-size:11px;opacity:.6;margin-top:3px}
.comp{display:flex;gap:6px;padding:10px;background:var(--sf);border-top:1px solid var(--ln);align-items:center}
.comp input{margin:0;flex:1}
.ic{width:42px;height:42px;border-radius:50%;border:0;background:var(--bk);color:var(--or);font-size:18px;cursor:pointer;flex:none}
.ic.go{background:var(--or);color:var(--bk)}
.menu{display:none;gap:8px;padding:8px 10px;background:var(--sf);border-top:1px solid var(--ln)}
.menu.on{display:flex}
.menu button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">

<section class="screen auth on" id="sAuth">
  <svg class="logo" width="84" height="84" viewBox="0 0 100 100" aria-label="Sharva logo">
    <rect width="100" height="100" rx="26" fill="#111"/>
    <path d="M22 28a10 10 0 0 1 10-10h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H48L33 80V64h-1a10 10 0 0 1-10-10z" fill="#FF7A00"/>
    <path d="M60 33c-3-4-14-4-17 1-3 5 3 8 8 9 5 1 10 4 7 9-3 5-14 5-18 0" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>Sharva</h1>
  <p class="sub">Chat and share with the people you love</p>
  <div class="tabs">
    <button id="tEmail" class="on" type="button">Email</button>
    <button id="tPhone" type="button">Phone number</button>
  </div>
  <div id="fEmail">
    <input type="text" id="nm" placeholder="Your name" autocomplete="name" style="display:none">
    <input type="email" id="em" placeholder="Email address" autocomplete="username">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  </div>
  <div id="fPhone" style="display:none">
    <input type="tel" id="ph" placeholder="Phone number with country code (+91...)" autocomplete="tel">
    <input type="text" id="otp" placeholder="6-digit OTP" inputmode="numeric" style="display:none">
  </div>
  <label class="chk"><input type="checkbox" id="rem" checked> Keep me logged in on this device</label>
  <p class="err" id="err"></p>
  <button class="btn" id="go" type="button">Login</button>
  <button class="link" id="swap" type="button">Create a new account</button>
  <div id="rc"></div>
  <div class="foot">App powered by <b>Kartikeya</b></div>
</section>

<section class="screen" id="sList">
  <div class="bar"><span class="t">Sharva</span><button id="newc" type="button">+ New chat</button><button id="out" type="button">Logout</button></div>
  <div class="list" id="chats"></div>
  <div class="foot">App powered by <b>Kartikeya</b></div>
</section>

<section class="screen" id="sChat">
  <div class="bar"><button id="back" type="button">Back</button><span class="t" id="cn"></span></div>
  <div class="msgs" id="msgs"></div>
  <div class="menu" id="menu">
    <button type="button" data-k="image/*">Photo</button>
    <button type="button" data-k="video/*">Video</button>
    <button type="button" data-k="audio/*">Audio</button>
  </div>
  <div class="comp">
    <button class="ic" id="plus" type="button" aria-label="Attach">+</button>
    <input type="text" id="tx" placeholder="Type a message">
    <button class="ic go" id="send" type="button" aria-label="Send">&#10148;</button>
  </div>
  <input type="file" id="file" hidden>
  <div class="foot">App powered by <b>Kartikeya</b></div>
</section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
/* ===== PASTE YOUR FIREBASE CONFIG HERE (see SETUP.md) ===== */
var CFG = {
  apiKey: "AIzaSyC2hdyAkWlEiAGpxO3EttWox5en_dPczeU",
  authDomain: "sharva-88b2c.firebaseapp.com",
  projectId: "sharva-88b2c",
  storageBucket: "sharva-88b2c.firebasestorage.app",
  messagingSenderId: "39181280284",
  appId: "1:39181280284:web:54d647f59cbcddb9efabd9"
};
/* ========================================================== */

var $ = function(i){return document.getElementById(i)};
firebase.initializeApp(CFG);
var auth = firebase.auth(), db = firebase.firestore(), st = firebase.storage();
var me = null, mode = 'email', signup = false, confirmation = null, rc = null;
var unChats = null, unMsgs = null, chatId = null, chatsCache = [];

function show(id){['sAuth','sList','sChat'].forEach(function(s){$(s).classList.toggle('on', s===id)})}
function err(t){$('err').textContent = t || ''}
function nice(e){
  var c = e && e.code || '';
  var map = {
    'auth/invalid-email':'Enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/email-already-in-use':'This email already has an account. Please login.',
    'auth/invalid-credential':'Wrong email or password.',
    'auth/user-not-found':'No account found. Create an account first.',
    'auth/wrong-password':'Wrong email or password.',
    'auth/invalid-phone-number':'Enter a valid phone number with country code.',
    'auth/invalid-verification-code':'Wrong OTP. Try again.',
    'auth/too-many-requests':'Too many attempts. Try again later.'
  };
  return map[c] || (e && e.message) || 'Something went wrong.';
}

/* ---------- auth UI ---------- */
function setMode(m){
  mode = m; err('');
  $('tEmail').classList.toggle('on', m==='email'); $('tPhone').classList.toggle('on', m==='phone');
  $('fEmail').style.display = m==='email' ? '' : 'none';
  $('fPhone').style.display = m==='phone' ? '' : 'none';
  $('swap').style.display = m==='email' ? '' : 'none';
  $('go').textContent = m==='phone' ? 'Send OTP' : (signup ? 'Create account' : 'Login');
}
$('tEmail').onclick = function(){setMode('email')};
$('tPhone').onclick = function(){setMode('phone')};
$('swap').onclick = function(){
  signup = !signup;
  $('nm').style.display = signup ? '' : 'none';
  $('swap').textContent = signup ? 'Already have an account? Login' : 'Create a new account';
  setMode('email');
};

$('go').onclick = async function(){
  err(''); $('go').disabled = true;
  try{
    await auth.setPersistence($('rem').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    if(mode==='email'){
      var em = $('em').value.trim(), pw = $('pw').value;
      if(signup){
        var nm = $('nm').value.trim();
        if(!nm){err('Enter your name.'); return}
        var cr = await auth.createUserWithEmailAndPassword(em, pw);
        await cr.user.updateProfile({displayName:nm});
        await saveProfile(cr.user, nm);
      } else {
        await auth.signInWithEmailAndPassword(em, pw);
      }
    } else if(!confirmation){
      if(!rc) rc = new firebase.auth.RecaptchaVerifier('rc', {size:'invisible'});
      confirmation = await auth.signInWithPhoneNumber($('ph').value.replace(/\s/g,''), rc);
      $('otp').style.display = ''; $('go').textContent = 'Verify OTP';
    } else {
      await confirmation.confirm($('otp').value.trim());
      confirmation = null;
    }
  }catch(e){ err(nice(e)); if(mode==='phone'){confirmation=null; $('otp').style.display='none'; $('go').textContent='Send OTP'; if(rc){rc.clear(); rc=null}} }
  finally{ $('go').disabled = false }
};

async function saveProfile(u, name){
  var d = {uid:u.uid, name:name || u.displayName || u.email || u.phoneNumber || 'User'};
  if(u.email) d.email = u.email.toLowerCase();
  if(u.phoneNumber) d.phone = u.phoneNumber;
  await db.collection('users').doc(u.uid).set(d, {merge:true});
  return d;
}

auth.onAuthStateChanged(async function(u){
  if(!u){ me = null; stopAll(); show('sAuth'); return }
  me = await saveProfile(u);
  watchChats(); show('sList');
});
$('out').onclick = function(){ auth.signOut() };

function stopAll(){ if(unChats){unChats();unChats=null} if(unMsgs){unMsgs();unMsgs=null} }

/* ---------- chat list ---------- */
function watchChats(){
  if(unChats) unChats();
  unChats = db.collection('chats').where('members','array-contains', me.uid).onSnapshot(function(s){
    chatsCache = s.docs.map(function(d){var x=d.data(); x.id=d.id; return x});
    chatsCache.sort(function(a,b){return (b.updated?b.updated.toMillis():0)-(a.updated?a.updated.toMillis():0)});
    renderList();
  }, function(e){ $('chats').innerHTML = '<p class="empty">'+nice(e)+'</p>' });
}
function other(c){ var o = c.members.filter(function(m){return m!==me.uid})[0]; return {uid:o, name:(c.names&&c.names[o])||'User'} }
function renderList(){
  var box = $('chats'); box.innerHTML = '';
  if(!chatsCache.length){ box.innerHTML = '<p class="empty">No chats yet. Tap + New chat and enter a friend\'s email or phone number.</p>'; return }
  chatsCache.forEach(function(c){
    var o = other(c), b = document.createElement('button'); b.className = 'row';
    var av = document.createElement('span'); av.className = 'av'; av.textContent = o.name[0].toUpperCase();
    var w = document.createElement('span'), n = document.createElement('b'), l = document.createElement('small');
    n.textContent = o.name; l.textContent = c.last || 'Start chatting';
    w.appendChild(n); w.appendChild(l); b.appendChild(av); b.appendChild(w);
    b.onclick = function(){ openChat(c.id, o.name) };
    box.appendChild(b);
  });
}

$('newc').onclick = async function(){
  var q = prompt('Friend\'s email or phone number (with +country code):'); if(!q) return;
  q = q.trim(); var field = q.indexOf('@')>-1 ? 'email' : 'phone';
  if(field==='email') q = q.toLowerCase(); else q = q.replace(/\s/g,'');
  try{
    var r = await db.collection('users').where(field,'==',q).limit(1).get();
    if(r.empty){ alert('No Sharva user found with that '+field+'. Ask them to join Sharva first.'); return }
    var f = r.docs[0].data();
    if(f.uid===me.uid){ alert('That is your own account.'); return }
    var id = [me.uid, f.uid].sort().join('_'), names = {}; names[me.uid] = me.name; names[f.uid] = f.name;
    await db.collection('chats').doc(id).set({members:[me.uid,f.uid], names:names, updated:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    openChat(id, f.name);
  }catch(e){ alert(nice(e)) }
};

/* ---------- messages ---------- */
function openChat(id, name){
  chatId = id; $('cn').textContent = name; show('sChat'); $('msgs').innerHTML = '';
  if(unMsgs) unMsgs();
  unMsgs = db.collection('chats').doc(id).collection('messages').orderBy('ts').onSnapshot(function(s){
    var box = $('msgs'); box.innerHTML = '';
    s.docs.forEach(function(d){ box.appendChild(bubble(d.data())) });
    box.scrollTop = box.scrollHeight;
  });
}
function bubble(m){
  var d = document.createElement('div'); d.className = 'm' + (m.from===me.uid ? ' me' : '');
  if(m.url){
    var e = document.createElement(m.type==='image' ? 'img' : m.type);
    e.src = m.url; if(m.type!=='image') e.controls = true; d.appendChild(e);
  }
  if(m.text){ var s = document.createElement('span'); s.textContent = m.text; d.appendChild(s) }
  var t = document.createElement('time');
  t.textContent = m.ts ? m.ts.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '...';
  d.appendChild(t); return d;
}
async function post(m, preview){
  var ts = firebase.firestore.FieldValue.serverTimestamp(); m.from = me.uid; m.ts = ts;
  var ref = db.collection('chats').doc(chatId);
  await ref.collection('messages').add(m);
  await ref.update({last:preview, updated:ts});
}
$('send').onclick = async function(){
  var v = $('tx').value.trim(); if(!v) return; $('tx').value = '';
  try{ await post({type:'text', text:v}, v) }catch(e){ alert(nice(e)) }
};
$('tx').onkeydown = function(e){ if(e.key==='Enter') $('send').onclick() };
$('plus').onclick = function(){ $('menu').classList.toggle('on') };
Array.prototype.forEach.call($('menu').querySelectorAll('button'), function(b){
  b.onclick = function(){ $('file').accept = b.dataset.k; $('file').click() };
});
$('file').onchange = async function(){
  var f = this.files[0]; this.value = ''; if(!f) return;
  if(f.size > 25*1024*1024){ alert('File is too large (max 25 MB).'); return }
  var type = f.type.indexOf('image')===0 ? 'image' : f.type.indexOf('video')===0 ? 'video' : 'audio';
  $('menu').classList.remove('on');
  try{
    var path = 'chats/'+chatId+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
    var snap = await st.ref(path).put(f);
    var url = await snap.ref.getDownloadURL();
    await post({type:type, url:url}, type==='image' ? 'Photo' : type==='video' ? 'Video' : 'Audio');
  }catch(e){ alert(nice(e)) }
};
$('back').onclick = function(){ if(unMsgs){unMsgs();unMsgs=null} chatId = null; show('sList') };
</script>
</body>
</html>
